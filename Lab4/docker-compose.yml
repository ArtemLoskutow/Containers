# docker-compose.yml
services:
  db:
    image: postgres:15
    container_name: loskutov-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - loskutov-pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT}:5432"
    networks:
      - loskutov-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: loskutov-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - loskutov-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: loskutov-assistant
    environment:
      APP_OWNER: ${APP_OWNER}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: ${CACHE_TTL}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "${APP_PORT}:5466"
    networks:
      - loskutov-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  loskutov-pgdata:

networks:
  loskutov-backend:
    driver: bridge
